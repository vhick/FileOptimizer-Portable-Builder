name: Build FileOptimizer Portable (Manual)
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'latest or official SourceForge version (example: 17.30.2881)'
        required: true
        default: 'latest'
        type: string
      expected_sha256:
        description: 'Optional: official SHA-256 (64 hex). Leave blank for official HTTPS + archive checks when SourceForge blocks checksums.'
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  build:
    name: Official FileOptimizer Portable ZIP
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v6
      - name: Check builder files
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
      - name: Build and verify official portable ZIP
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.release_version }}
          SHA256_INPUT: ${{ inputs.expected_sha256 }}
        run: |
          ./scripts/build.ps1 -ReleaseVersion "$env:VERSION_INPUT" -ExpectedSha256 "$env:SHA256_INPUT"
      - name: Upload complete portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: FileOptimizerPortable-Windows-x64
          path: dist/FileOptimizerPortable-*.zip
          if-no-files-found: error
          retention-days: 1
